<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="assets/motion.js"></script>
    <style>
      @font-face { font-family: "Plex"; src: url("assets/IBMPlexSans-Bold.ttf") format("truetype"); font-weight: 700; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0E1214; }
      #root { position: relative; width: 1080px; height: 1920px; font-family: "Plex", sans-serif; color: #E9E8E4; overflow: hidden; }
      #bg { position: absolute; inset: 0; background: #0E1214; }
      #grid { position: absolute; left: -120px; top: -120px; width: 1320px; height: 2160px; opacity: 0.16;
              background-image: linear-gradient(#2E363A 2px, transparent 2px), linear-gradient(90deg, #2E363A 2px, transparent 2px);
              background-size: 120px 120px; }
      #glow { position: absolute; left: -300px; top: 300px; width: 1680px; height: 1200px;
              background: radial-gradient(ellipse at center, rgba(0,180,180,0.2) 0%, rgba(0,180,180,0) 60%); }
      #stage { position: absolute; inset: 0; transform-origin: 50% 45%; }
      #head { position: absolute; left: 0; width: 1080px; top: 250px; text-align: center; font-size: 38px; letter-spacing: 10px; color: #00B4B4; }
      #line { position: absolute; left: 197px; top: 520px; width: 6px; height: 780px; background: #00B4B4; border-radius: 3px; transform-origin: top center; transform: scaleY(0); }
      #head, .row { opacity: 0; }
      .row { position: absolute; left: 110px; width: 880px; height: 180px; }
      .ic { position: absolute; left: 0; top: 0; width: 180px; height: 180px; border-radius: 32px; border: 4px solid #00B4B4;
            background: #161C1F; display: flex; align-items: center; justify-content: center; }
      .ic svg { width: 100px; height: 100px; }
      .t { position: absolute; left: 230px; top: 22px; font-size: 92px; line-height: 1; letter-spacing: 1px; }
      .s { position: absolute; left: 234px; top: 124px; font-size: 40px; color: #A5ABAE; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="7.67" data-width="1080" data-height="1920">
      <div id="bg" class="clip" data-start="0" data-duration="7.67" data-track-index="0"></div>
      <div id="grid" class="clip" data-start="0" data-duration="7.67" data-track-index="1"></div>
      <div id="glow" class="clip" data-start="0" data-duration="7.67" data-track-index="2"></div>
      <div id="stage" class="clip" data-start="0" data-duration="7.67" data-track-index="3">
        <div id="head">THE SYSTEM</div>
        <div id="line"></div>
        <div class="row" id="r1" style="top: 430px;">
          <div class="ic"><svg viewBox="0 0 100 100" fill="none" stroke="#00B4B4" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><rect x="36" y="10" width="28" height="50" rx="14"/><path d="M22 46a28 28 0 0 0 56 0M50 74v16M36 90h28"/></svg></div>
          <div class="t">RECORD</div><div class="s">it listens</div>
        </div>
        <div class="row" id="r2" style="top: 690px;">
          <div class="ic"><svg viewBox="0 0 100 100" fill="none" stroke="#00B4B4" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><circle cx="26" cy="74" r="13"/><circle cx="74" cy="74" r="13"/><path d="M35 64 78 12M65 64 22 12"/></svg></div>
          <div class="t">CUT</div><div class="s">pauses + retakes</div>
        </div>
        <div class="row" id="r3" style="top: 950px;">
          <div class="ic"><svg viewBox="0 0 100 100" fill="none" stroke="#00B4B4" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="20" width="84" height="60" rx="10"/><path d="M44 42a10 10 0 1 0 0 16M74 42a10 10 0 1 0 0 16"/></svg></div>
          <div class="t">CAPTION</div><div class="s">writes them</div>
        </div>
        <div class="row" id="r4" style="top: 1210px;">
          <div class="ic"><svg viewBox="0 0 100 100" fill="none" stroke="#00B4B4" stroke-width="7" stroke-linecap="round"><path d="M10 50h8M26 34v32M42 18v64M58 30v40M74 40v20M90 50h0"/></svg></div>
          <div class="t">SOUND</div><div class="s">cleans it</div>
        </div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const END = 7.67;
      // each step lands on its spoken verb (local times from build_edl_01.py): listens, cuts, writes, cleans
      const STEPS = [0.15, 1.76, 4.4, 6.54];
      tl.fromTo("#grid", { x: 0, y: 0 }, { x: -60, y: -120, duration: END, ease: "none" }, 0);
      tl.fromTo("#stage", { scale: 1.06 }, { scale: 1, duration: END - 0.45, ease: "power1.out" }, 0);
      tl.fromTo("#head", { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" }, 0);
      STEPS.forEach((t, i) => {
        const r = `#r${i + 1}`;
        if (i > 0) {
          tl.to(`#r${i}`, { opacity: 0.4, duration: 0.2 }, t);
          tl.to("#line", { scaleY: i / 3, duration: 0.3, ease: "power2.out" }, t - 0.25);
        }
        tl.fromTo(r, { opacity: 0, x: 140 }, { opacity: 1, x: 0, duration: 0.28, ease: Motion.ease(0.35, "type") }, t);
        tl.fromTo(`${r} .ic`, { scale: 0.4 }, { scale: 1, duration: 0.4, ease: Motion.ease(0.45, "ui") }, t);
        tl.fromTo(`${r} .ic`, { backgroundColor: "#00B4B4" }, { backgroundColor: "#161C1F", duration: 0.5, ease: "power2.out" }, t + 0.1);
      });
      // all four together on "sound."
      tl.to(".row", { opacity: 1, duration: 0.2 }, 6.9);
      tl.to(".ic", { borderColor: "#E9E8E4", duration: 0.15, yoyo: true, repeat: 1 }, 6.9);
      // exit: the board eases back while the editor dissolves to the face (fade_out 0.3s)
      tl.to("#stage", { scale: 0.94, duration: 0.45, ease: "power2.in" }, END - 0.45);
      for (let b = 0; b < 14; b++) tl.fromTo("#glow", { opacity: 1 }, { opacity: 0.6, duration: 0.45, ease: "power2.out" }, b * 0.5);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
