<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Plex";
        src: url("assets/IBMPlexSans-Bold.ttf") format("truetype");
        font-weight: 700;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 1080px; height: 1920px; font-family: "Plex", sans-serif; }
      #panel {
        position: absolute; left: 40px; top: 1590px; width: 1000px; height: 200px;
        background: rgba(14, 18, 20, 0.92); border-radius: 28px;
        border: 2px solid rgba(0, 180, 180, 0.35);
      }
      .row { position: absolute; left: 0; top: 0; width: 1000px; height: 200px;
             display: flex; align-items: center; justify-content: center; gap: 0; }
      .chip {
        width: 196px; height: 86px; border-radius: 18px; border: 3px solid #00B4B4;
        color: #E9E8E4; font-size: 30px; letter-spacing: 1.5px;
        display: flex; align-items: center; justify-content: center;
      }
      .arrow { width: 36px; height: 4px; background: #00B4B4; margin: 0 6px; transform-origin: left center; }
      #bar { position: absolute; left: 60px; top: 168px; width: 880px; height: 6px; border-radius: 3px;
             background: #00B4B4; transform-origin: left center; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3.5" data-width="1080" data-height="1920">
      <div id="panel" class="clip" data-start="0" data-duration="3.5" data-track-index="0">
        <div class="row">
          <div class="chip" id="c1">RECORD</div>
          <div class="arrow" id="a1"></div>
          <div class="chip" id="c2">CUT</div>
          <div class="arrow" id="a2"></div>
          <div class="chip" id="c3">CAPTION</div>
          <div class="arrow" id="a3"></div>
          <div class="chip" id="c4">PUBLISH</div>
        </div>
        <div id="bar"></div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // panel enters
      tl.fromTo("#panel", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 0);
      // steps build in sync with "video content creation pipeline"
      const chips = ["#c1", "#c2", "#c3", "#c4"];
      const arrows = ["#a1", "#a2", "#a3"];
      chips.forEach((c, i) => {
        const t = 0.1 + i * 0.3;
        if (i > 0) tl.fromTo(arrows[i - 1], { scaleX: 0 }, { scaleX: 1, duration: 0.15, ease: "power2.out" }, t - 0.12);
        tl.fromTo(c, { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2)" }, t);
      });
      // "pipeline": one line ties the steps together, then the last step lights up
      tl.fromTo("#bar", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.inOut" }, 1.45);
      tl.to("#c4", { backgroundColor: "#00B4B4", color: "#0E1214", duration: 0.2, ease: "power1.out" }, 1.9);
      // exit
      tl.to("#panel", { opacity: 0, y: 40, duration: 0.35, ease: "power2.in" }, 3.1);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
