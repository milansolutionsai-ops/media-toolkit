<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="assets/motion.js"></script>
    <style>
      @font-face { font-family: "Plex"; src: url("assets/IBMPlexSans-Bold.ttf") format("truetype"); font-weight: 700; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0E1214; }
      #root { position: relative; width: 1080px; height: 1920px; font-family: "Plex", sans-serif; color: #E9E8E4; overflow: hidden; }
      #bg { position: absolute; inset: 0; background: #0E1214; }
      #grid { position: absolute; left: -120px; top: -120px; width: 1320px; height: 2160px; opacity: 0.16;
              background-image: linear-gradient(#2E363A 2px, transparent 2px), linear-gradient(90deg, #2E363A 2px, transparent 2px);
              background-size: 120px 120px; }
      #glow { position: absolute; left: -300px; top: 400px; width: 1680px; height: 1100px;
              background: radial-gradient(ellipse at center, rgba(0,180,180,0.18) 0%, rgba(0,180,180,0) 60%); }
      #stage { position: absolute; inset: 0; transform-origin: 50% 50%; }
      #title { position: absolute; left: 0; width: 1080px; top: 300px; text-align: center; font-size: 40px; letter-spacing: 10px; color: #00B4B4; opacity: 0; }
      #wires { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: visible; }
      .wire { opacity: 0; fill: none; stroke: #00B4B4; stroke-width: 6; stroke-linecap: round; }
      .node { position: absolute; width: 280px; height: 200px; margin-left: -140px; margin-top: -100px; opacity: 0;
              border: 4px solid #00B4B4; border-radius: 28px; background: #161C1F;
              display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
      .node .n { font-size: 50px; letter-spacing: 1px; text-align: center; line-height: 1.05; }
      .node .s { font-size: 30px; color: #A5ABAE; text-align: center; }
      .tag { position: absolute; transform: translate(-50%, -50%); padding: 10px 22px; border-radius: 999px; opacity: 0;
             background: #00B4B4; color: #0E1214; font-size: 34px; letter-spacing: 2px; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="9" data-width="1080" data-height="1920">
      <div id="bg" class="clip" data-start="0" data-duration="9" data-track-index="0"></div>
      <div id="grid" class="clip" data-start="0" data-duration="9" data-track-index="1"></div>
      <div id="glow" class="clip" data-start="0" data-duration="9" data-track-index="2"></div>
      <div id="stage" class="clip" data-start="0" data-duration="9" data-track-index="3">
        <div id="title"></div>
        <svg id="wires" viewBox="0 0 1080 1920"></svg>
      </div>
    </div>
    <script>
      // ── EDIT HERE ─────────────────────────────────────────────────────────────────
      // Times are seconds into this clip, each one = the spoken word it lands on
      // (from the edit's word timings). Coordinates are node centres on a 1080x1920 frame.
      // Keep nodes inside x 180-900, y 500-1450 (captions live below, hook box above).
      const END = 9;                                  // clip length; also set data-duration above (4 places)
      const TITLE = { text: "WHAT IS AN API?", t: 0.0 };
      const NODES = [
        { id: "you",     x: 270, y: 700,  label: "YOU",     sub: "the table",      t: 0.6 },
        { id: "kitchen", x: 810, y: 700,  label: "KITCHEN", sub: "where it's made", t: 1.8 },
        { id: "waiter",  x: 540, y: 1150, label: "WAITER",  sub: "goes between",   t: 3.2 },
      ];
      const WIRES = [   // from → to; drawn on its word
        { from: "you",    to: "waiter",  t: 3.9 },
        { from: "waiter", to: "kitchen", t: 4.4 },
      ];
      const TAGS = [    // labels that land after the picture is built: placed at a node or between two
        { text: "FRONT END", at: "you",           t: 6.0 },
        { text: "BACK END",  at: "kitchen",       t: 6.6 },
        { text: "= API",     at: "waiter",        t: 7.2, dy: 150 },
      ];
      // ─────────────────────────────────────────────────────────────────────────────

      const stage = document.getElementById("stage"), svg = document.getElementById("wires");
      const pos = Object.fromEntries(NODES.map((n) => [n.id, n]));
      document.getElementById("title").textContent = TITLE.text;
      NODES.forEach((n) => {
        const el = document.createElement("div");
        el.className = "node"; el.id = `n-${n.id}`;
        el.style.left = `${n.x}px`; el.style.top = `${n.y}px`;
        el.innerHTML = `<div class="n">${n.label}</div>${n.sub ? `<div class="s">${n.sub}</div>` : ""}`;
        stage.appendChild(el);
      });
      WIRES.forEach((w, i) => {   // straight line, trimmed so it starts and ends at the box edges
        const a = pos[w.from], b = pos[w.to], dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy);
        const trim = (ux, uy) => Math.min(140 / Math.max(Math.abs(ux), 1e-6), 100 / Math.max(Math.abs(uy), 1e-6)) + 18;
        const ux = dx / len, uy = dy / len, ta = trim(ux, uy);
        const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
        p.setAttribute("class", "wire"); p.id = `w-${i}`;
        p.setAttribute("d", `M ${a.x + ux * ta} ${a.y + uy * ta} L ${b.x - ux * ta} ${b.y - uy * ta}`);
        svg.appendChild(p);
      });
      TAGS.forEach((g, i) => {
        const el = document.createElement("div");
        const n = pos[g.at];
        el.className = "tag"; el.id = `g-${i}`; el.textContent = g.text;
        el.style.left = `${n.x}px`; el.style.top = `${n.y + (g.dy ?? -150)}px`;
        stage.appendChild(el);
      });

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#grid", { x: 0, y: 0 }, { x: -60, y: -120, duration: END, ease: "none" }, 0);
      tl.fromTo("#stage", { scale: 1.05 }, { scale: 1, duration: END - 0.5, ease: "power1.out" }, 0);
      tl.fromTo("#title", { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, TITLE.t);
      NODES.forEach((n) => {
        tl.fromTo(`#n-${n.id}`, { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.4, ease: Motion.ease(0.45, "ui") }, n.t);
        tl.fromTo(`#n-${n.id}`, { backgroundColor: "#00B4B4" }, { backgroundColor: "#161C1F", duration: 0.5 }, n.t + 0.1);
      });
      WIRES.forEach((w, i) => {
        const p = document.getElementById(`w-${i}`), L = p.getTotalLength();
        p.style.strokeDasharray = `${L}`;
        tl.set(p, { opacity: 1 }, w.t);
        tl.fromTo(p, { strokeDashoffset: L }, { strokeDashoffset: 0, duration: 0.45, ease: "power2.inOut" }, w.t);
      });
      TAGS.forEach((g, i) => tl.fromTo(`#g-${i}`, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: Motion.ease(0.45, "ui") }, g.t));
      tl.to("#stage", { scale: 0.94, duration: 0.45, ease: "power2.in" }, END - 0.45);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
