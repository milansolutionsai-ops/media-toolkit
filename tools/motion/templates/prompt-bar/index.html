<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="assets/motion.js"></script>
    <style>
      @font-face { font-family: "Plex"; src: url("assets/IBMPlexSans-Bold.ttf") format("truetype"); font-weight: 700; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 1080px; height: 1920px; font-family: "Plex", sans-serif; }
      #bar { position: absolute; left: 40px; width: 1000px; min-height: 130px; border-radius: 65px; opacity: 0;
             background: rgba(25, 31, 34, 0.96); border: 2px solid #2E363A; box-shadow: 0 14px 50px rgba(0, 0, 0, 0.5);
             display: flex; align-items: center; padding: 26px 26px 26px 52px; gap: 24px; }
      #text { flex: 1; font-size: 44px; line-height: 1.25; color: #E9E8E4; }
      #text .ph { color: #7C8487; }
      #caret { display: inline-block; width: 4px; height: 46px; background: #00B4B4; vertical-align: -8px; margin-left: 4px; }
      #send { width: 78px; height: 78px; border-radius: 50%; background: #2E363A; flex: none;
              display: flex; align-items: center; justify-content: center; }
      #send svg { width: 40px; height: 40px; }
    </style>
  </head>
  <body>
    <!-- Overlay with alpha: render with  npx hyperframes render . --format mov -o renders/prompt.mov -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1080" data-height="1920">
      <div id="bar" class="clip" data-start="0" data-duration="5" data-track-index="0">
        <div id="text"><span id="typed"></span><span id="caret"></span></div>
        <div id="send"><svg viewBox="0 0 40 40" fill="none" stroke="#0E1214" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 31V9M10 19l10-10 10 10"/></svg></div>
      </div>
    </div>
    <script>
      // ── EDIT HERE ───────────────────────────────────────────────
      const PROMPT = "Read every file in this folder, then plan the build with me before writing any code.";
      const TYPE_FROM = 0.4, TYPE_TO = 3.2;  // typing window (match it to when you say the prompt)
      const SEND_AT = 3.6;                   // send button lights up (on the word that sends it)
      const Y = 1100;                        // top of the bar (chest zone)
      const END = 5;                         // also data-duration above (2 places)
      // ────────────────────────────────────────────────────────────
      const bar = document.getElementById("bar"), typed = document.getElementById("typed");
      bar.style.top = `${Y}px`;
      const state = { n: 0 };
      const paint = () => { typed.textContent = PROMPT.slice(0, Math.round(state.n)); };

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#bar", { opacity: 0, y: 40, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: Motion.ease(0.45, "ui") }, 0);
      tl.fromTo(state, { n: 0 }, { n: PROMPT.length, duration: TYPE_TO - TYPE_FROM, ease: "none", onUpdate: paint }, TYPE_FROM);
      // caret blinks while idle (deterministic: tied to the timeline)
      for (let t = TYPE_TO; t < SEND_AT; t += 0.5) tl.set("#caret", { opacity: 0 }, t + 0.25).set("#caret", { opacity: 1 }, t + 0.5);
      tl.to("#send", { backgroundColor: "#00B4B4", duration: 0.15 }, SEND_AT);
      tl.fromTo("#send", { scale: 0.85 }, { scale: 1, duration: 0.4, ease: Motion.ease(0.4, "ui") }, SEND_AT);
      tl.set("#caret", { opacity: 0 }, SEND_AT);
      tl.to("#bar", { opacity: 0, y: -30, duration: 0.25, ease: "power2.in" }, END - 0.25);
      window.__timelines["main"] = tl;
      tl.seek(0);
      paint();
    </script>
  </body>
</html>
